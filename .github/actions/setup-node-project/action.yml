name: Setup Node.js project
description: Checkout, setup Node.js 22 with npm cache, install dependencies, and restore build caches

inputs:
  lfs:
    description: Whether to checkout with Git LFS
    required: false
    default: 'false'
  ref:
    description: Optional git ref to checkout (defaults to the triggering ref)
    required: false
    default: ''
  skip-install:
    description: Skip npm ci when node_modules cache was restored
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        lfs: ${{ inputs.lfs == 'true' }}
        ref: ${{ inputs.ref || github.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Restore node_modules cache
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-

    - name: Restore Next.js cache
      uses: actions/cache@v4
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          next-${{ runner.os }}-

    - name: Restore Jest cache
      uses: actions/cache@v4
      with:
        path: node_modules/.cache/jest
        key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js') }}
        restore-keys: |
          jest-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.skip-install != 'true' || steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
          npm install --package-lock-only --workspaces --include-workspace-root
        fi
        npm ci
