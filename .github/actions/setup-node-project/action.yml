name: Setup Node.js project
description: Checkout, setup Node.js 22 with npm cache, and install dependencies

inputs:
  lfs:
    description: Whether to checkout with Git LFS
    required: false
    default: 'false'
  ref:
    description: Optional git ref to checkout (defaults to the triggering ref)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        lfs: ${{ inputs.lfs == 'true' }}
        ref: ${{ inputs.ref || github.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
          npm install --package-lock-only --workspaces --include-workspace-root
        fi
        npm ci
