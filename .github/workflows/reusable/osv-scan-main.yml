name: Reusable — OSV Scan (main)

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv_scan_main:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: true
      scan-args: |-
        --recursive
        --severity=HIGH
        --severity=CRITICAL
        ./
