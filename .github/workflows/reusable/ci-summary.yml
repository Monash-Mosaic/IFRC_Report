name: Reusable — CI Summary

on:
  workflow_call:
    inputs:
      security-gates-result:
        required: true
        type: string
      coverage-report-result:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci_summary:
    runs-on: ubuntu-latest
    steps:
      - name: Write CI timing summary
        run: |
          echo "## CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ci-checks | ${{ inputs.security-gates-result == 'success' && '✅' || 'see jobs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| security_gates | ${{ inputs.security-gates-result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage_report | ${{ inputs.coverage-report-result }} |" >> "$GITHUB_STEP_SUMMARY"
