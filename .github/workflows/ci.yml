name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  dependency_review:
    uses: ./.github/workflows/reusable/dependency-review.yml

  osv_scan_pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable/osv-scan-pr.yml

  osv_scan_main:
    if: github.event_name == 'push'
    uses: ./.github/workflows/reusable/osv-scan-main.yml

  ci-checks:
    uses: ./.github/workflows/reusable/ci-checks.yml

  base_coverage:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable/base-coverage.yml

  security_gates:
    needs:
      - dependency_review
      - osv_scan_pr
      - osv_scan_main
      - ci-checks
    if: >-
      always() &&
      !cancelled() &&
      needs.dependency_review.result == 'success' &&
      (needs.osv_scan_pr.result == 'success' || needs.osv_scan_pr.result == 'skipped') &&
      (needs.osv_scan_main.result == 'success' || needs.osv_scan_main.result == 'skipped') &&
      needs.ci-checks.result == 'success'
    uses: ./.github/workflows/reusable/security-gates.yml

  coverage_report:
    needs:
      - ci-checks
      - base_coverage
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable/coverage-report.yml

  ci_summary:
    needs:
      - security_gates
      - coverage_report
    if: always()
    uses: ./.github/workflows/reusable/ci-summary.yml
    with:
      security-gates-result: ${{ needs.security_gates.result }}
      coverage-report-result: ${{ needs.coverage_report.result }}

  cleanup:
    needs:
      - ci_summary
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/reusable/cleanup.yml
    secrets: inherit
