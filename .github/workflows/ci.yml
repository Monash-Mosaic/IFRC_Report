name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/dependency-review

  osv_scan_pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      fail-on-vuln: true

  osv_scan_main:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: true
      scan-args: |-
        --recursive
        --severity=HIGH
        --severity=CRITICAL
        ./

  ci-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: lint
            command: npm run lint
          - id: test
            command: npm run ci:test
          - id: build
            command: npm run ci:build
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-ci-check
        with:
          check: ${{ matrix.id }}
          command: ${{ matrix.command }}

  base_coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout base branch code
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm install --package-lock-only --workspaces --include-workspace-root
          fi
          npm ci

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Collect base branch coverage
        run: npm run ci:test

      - name: Upload base coverage report
        uses: actions/upload-artifact@v4
        with:
          name: base-coverage-report
          path: report.json
          retention-days: 1

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules coverage
          rm -f report.json

  security_gates:
    needs:
      - dependency_review
      - osv_scan_pr
      - osv_scan_main
      - ci-checks
    if: >-
      always() &&
      !cancelled() &&
      needs.dependency_review.result == 'success' &&
      (needs.osv_scan_pr.result == 'success' || needs.osv_scan_pr.result == 'skipped') &&
      (needs.osv_scan_main.result == 'success' || needs.osv_scan_main.result == 'skipped') &&
      needs.ci-checks.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: All security gates passed
        run: echo "lint, test, build, dependency review, and OSV scan succeeded."

  coverage_report:
    needs:
      - ci-checks
      - base_coverage
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/post-coverage-report

  ci_summary:
    needs:
      - security_gates
      - coverage_report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/write-ci-summary
        with:
          security-gates-result: ${{ needs.security_gates.result }}
          coverage-report-result: ${{ needs.coverage_report.result }}

  cleanup:
    needs:
      - ci_summary
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/cleanup-workflow-artifacts
