name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  security_gates:
    runs-on: ubuntu-latest
    needs: dependency_review
    permissions:
      checks: write
      pull-requests: write
      contents: write

    steps:
      - name: Setup Node.js project
        uses: ./.github/actions/setup-node-project
        with:
          lfs: 'true'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run ci:test

      - name: Collect test coverage
        if: ${{ success() && github.event_name == 'pull_request' && hashFiles('report.json') != '' }}
        uses: ArtiomTr/jest-coverage-report-action@v2
        id: coverage
        with:
          coverage-file: ./report.json
          base-coverage-file: ./report.json
          skip-step: all
          annotations: none
          output: report-markdown

      - name: Post coverage comment
        if: ${{ success() && github.event_name == 'pull_request' && steps.coverage.outputs.report != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          message: ${{ steps.coverage.outputs.report }}

      - name: Build
        run: npm run ci:build
