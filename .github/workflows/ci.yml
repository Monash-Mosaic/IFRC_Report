name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  osv_scan_pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      fail-on-vuln: true

  osv_scan_main:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: true
      scan-args: |-
        --recursive
        --severity=HIGH
        --severity=CRITICAL
        ./

  ci-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: lint
            command: npm run lint
          - id: test
            command: npm run ci:test
          - id: build
            command: npm run ci:build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm install --package-lock-only --workspaces --include-workspace-root
          fi
          npm ci

      - name: Lint
        if: matrix.id == 'lint'
        run: ${{ matrix.command }}

      - name: Test
        if: matrix.id == 'test'
        id: test
        run: ${{ matrix.command }}

      - name: Publish test report
        if: always() && matrix.id == 'test' && steps.test.outcome != 'skipped'
        uses: dorny/test-reporter@v2
        with:
          name: Jest Tests
          path: junit.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Write test summary
        if: always() && matrix.id == 'test' && steps.test.outcome != 'skipped'
        run: |
          if [ ! -f report.json ]; then
            {
              echo '## Test results'
              echo ''
              echo '_Test report could not be parsed._'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          STATUS_ICON=$(jq -r 'if .success then "✅" else "❌" end' report.json)
          NUM_TOTAL=$(jq -r '.numTotalTests // 0' report.json)
          NUM_PASSED=$(jq -r '.numPassedTests // 0' report.json)
          NUM_FAILED=$(jq -r '.numFailedTests // 0' report.json)
          NUM_PENDING=$(jq -r '.numPendingTests // 0' report.json)
          DURATION_MS=$(jq -r '
            if (.endTime and .startTime) then (.endTime - .startTime)
            else ([.testResults[]?.assertionResults[]?.duration // 0] | add) end
          ' report.json)
          if [ "$DURATION_MS" != "0" ] && [ -n "$DURATION_MS" ]; then
            DURATION_SEC=$(awk "BEGIN {printf \"%.1f\", $DURATION_MS / 1000}")
          else
            DURATION_SEC="—"
          fi

          {
            echo "## Test results ${STATUS_ICON}"
            echo ''
            echo '| Metric | Count |'
            echo '| --- | ---: |'
            echo "| Total | ${NUM_TOTAL} |"
            echo "| Passed | ${NUM_PASSED} |"
            echo "| Failed | ${NUM_FAILED} |"
            echo "| Skipped | ${NUM_PENDING} |"
            echo "| Duration | ${DURATION_SEC}s |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED_LIST=$(jq -r '
            [.testResults[]?.assertionResults[]? | select(.status == "failed") | "- `" + .fullName + "`"]
            | .[0:20] | join("\n")
          ' report.json)
          if [ -n "$FAILED_LIST" ]; then
            {
              echo ''
              echo '### Failed tests'
              echo ''
              echo "$FAILED_LIST"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$NUM_FAILED" -gt 20 ]; then
              echo "_…and $((NUM_FAILED - 20)) more. See the Checks tab for details._" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload test report artifact
        if: always() && matrix.id == 'test' && hashFiles('report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.json
            junit.xml
          retention-days: 7

      - name: Build
        if: matrix.id == 'build'
        run: ${{ matrix.command }}

      - name: Save Next.js cache
        if: always() && matrix.id == 'build'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .next .open-next coverage
          rm -f report.json junit.xml

  base_coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm install --package-lock-only --workspaces --include-workspace-root
          fi
          npm ci

      - name: Collect base branch coverage
        run: npm run ci:test

      - name: Upload base coverage report
        uses: actions/upload-artifact@v4
        with:
          name: base-coverage-report
          path: report.json
          retention-days: 1

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules coverage
          rm -f report.json

  security_gates:
    runs-on: ubuntu-latest
    needs:
      - dependency_review
      - osv_scan_pr
      - osv_scan_main
      - ci-checks
    if: >-
      always() &&
      !cancelled() &&
      needs.dependency_review.result == 'success' &&
      (needs.osv_scan_pr.result == 'success' || needs.osv_scan_pr.result == 'skipped') &&
      (needs.osv_scan_main.result == 'success' || needs.osv_scan_main.result == 'skipped') &&
      needs.ci-checks.result == 'success'
    steps:
      - name: All security gates passed
        run: echo "lint, test, build, dependency review, and OSV scan succeeded."

  coverage_report:
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - ci-checks
      - base_coverage
    permissions:
      contents: read

    steps:
      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report

      - name: Download base coverage report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: base-coverage-report

      - name: Build PR quality report
        id: build_comment
        if: hashFiles('report.json') != ''
        run: |
          BASE_REPORT_PATH=""
          if [ -f base-coverage-report/report.json ]; then
            BASE_REPORT_PATH=base-coverage-report/report.json
          fi

          coverage_pct() {
            local file="$1"
            jq -r '
              [.coverageMap // {} | .[] | .s // {} | .[]] as $hits
              | if ($hits | length) == 0 then empty
                else (($hits | map(select(. > 0)) | length) / ($hits | length) * 100) end
            ' "$file" 2>/dev/null
          }

          NUM_PASSED=$(jq -r '.numPassedTests // 0' report.json)
          NUM_FAILED=$(jq -r '.numFailedTests // 0' report.json)
          NUM_PENDING=$(jq -r '.numPendingTests // 0' report.json)
          SUCCESS=$(jq -r '.success' report.json)
          DURATION_MS=$(jq -r '
            if (.endTime and .startTime) then (.endTime - .startTime)
            else ([.testResults[]?.assertionResults[]?.duration // 0] | add) end
          ' report.json)
          if [ "$DURATION_MS" != "0" ] && [ -n "$DURATION_MS" ]; then
            DURATION_SEC=$(awk "BEGIN {printf \"%.1f\", $DURATION_MS / 1000}")
            DURATION_SUFFIX=" (${DURATION_SEC}s)"
          else
            DURATION_SUFFIX=""
          fi

          if [ "$NUM_FAILED" -gt 0 ]; then
            TESTS_LINE="❌ ${NUM_PASSED} passed, ${NUM_FAILED} failed"
            [ "$NUM_PENDING" -gt 0 ] && TESTS_LINE="${TESTS_LINE}, ${NUM_PENDING} skipped"
            TESTS_LINE="${TESTS_LINE}${DURATION_SUFFIX}"
          elif [ "$SUCCESS" != "true" ]; then
            TESTS_LINE="❌ Tests did not complete successfully"
          else
            TESTS_LINE="✅ ${NUM_PASSED} passed"
            [ "$NUM_PENDING" -gt 0 ] && TESTS_LINE="${TESTS_LINE}, ${NUM_PENDING} skipped"
            TESTS_LINE="${TESTS_LINE}${DURATION_SUFFIX}"
          fi

          HEAD_PCT=$(coverage_pct report.json)
          if [ -z "$HEAD_PCT" ]; then
            COVERAGE_LINE="—"
          else
            HEAD_FMT=$(awk "BEGIN {printf \"%.1f\", $HEAD_PCT}")
            if [ -n "$BASE_REPORT_PATH" ] && [ -f "$BASE_REPORT_PATH" ]; then
              BASE_PCT=$(coverage_pct "$BASE_REPORT_PATH")
              if [ -n "$BASE_PCT" ]; then
                DELTA=$(awk "BEGIN {printf \"%.1f\", $HEAD_PCT - $BASE_PCT}")
                SIGN=$([ "$(awk "BEGIN {print ($DELTA > 0)}")" = "1" ] && echo '+' || echo '')
                COVERAGE_LINE="${HEAD_FMT}% (${SIGN}${DELTA}% vs main)"
              else
                COVERAGE_LINE="${HEAD_FMT}%"
              fi
            else
              COVERAGE_LINE="${HEAD_FMT}%"
            fi
          fi

          {
            echo '<!-- pr-quality-report -->'
            echo '## PR Quality Report'
            echo ''
            echo '| Category | Status |'
            echo '| --- | --- |'
            echo "| Tests | ${TESTS_LINE} |"
            echo "| Coverage | ${COVERAGE_LINE} |"
            echo '| Preview Deployment | ⏳ Deploying… |'
            echo '| Worker Version | _pending deploy_ |'
          } > pr-quality-comment.md

          if [ ! -s pr-quality-comment.md ]; then
            echo "::error::PR quality comment file is missing or empty after build."
            exit 1
          fi

      - name: Upload PR quality report artifact
        if: steps.build_comment.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-report
          path: pr-quality-comment.md
          retention-days: 7

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf base-coverage-report
          rm -f report.json junit.xml pr-quality-comment.md

  ci_summary:
    runs-on: ubuntu-latest
    needs:
      - security_gates
      - coverage_report
    if: always()
    steps:
      - name: Write CI timing summary
        run: |
          echo "## CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ci-checks | ${{ needs.security_gates.result == 'success' && '✅' || 'see jobs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| security_gates | ${{ needs.security_gates.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage_report | ${{ needs.coverage_report.result }} |" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - ci_summary
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete workflow artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].id')
          if [ -z "$artifact_ids" ]; then
            echo "No workflow artifacts to delete."
            exit 0
          fi
          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              && echo "Deleted artifact ${artifact_id}" \
              || echo "Failed to delete artifact ${artifact_id}"
          done
