name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  osv_scan_pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      fail-on-vuln: true

  osv_scan_main:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      fail-on-vuln: true
      scan-args: |-
        --recursive
        --severity=HIGH
        --severity=CRITICAL
        ./

  ci-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: lint
            command: npm run lint
          - id: test
            command: npm run ci:test
          - id: build
            command: npm run ci:build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/npm-ci.sh

      - name: Lint
        if: matrix.id == 'lint'
        run: ${{ matrix.command }}

      - name: Test
        if: matrix.id == 'test'
        id: test
        run: ${{ matrix.command }}

      - name: Publish test report
        if: always() && matrix.id == 'test' && steps.test.outcome != 'skipped'
        uses: dorny/test-reporter@v2
        with:
          name: Jest Tests
          path: junit.xml
          reporter: jest-junit
          fail-on-error: true

      - name: Write test summary
        if: always() && matrix.id == 'test' && steps.test.outcome != 'skipped'
        run: node scripts/ci/write-test-summary.mjs report.json

      - name: Upload test report artifact
        if: always() && matrix.id == 'test' && hashFiles('report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.json
            junit.xml
          retention-days: 7

      - name: Build
        if: matrix.id == 'build'
        run: ${{ matrix.command }}

      - name: Save Next.js cache
        if: always() && matrix.id == 'build'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  base_coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'jest.config.js') }}
          restore-keys: |
            jest-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/npm-ci.sh

      - name: Collect base branch coverage
        run: npm run ci:test

      - name: Upload base coverage report
        uses: actions/upload-artifact@v4
        with:
          name: base-coverage-report
          path: report.json
          retention-days: 1

  security_gates:
    runs-on: ubuntu-latest
    needs:
      - dependency_review
      - osv_scan_pr
      - osv_scan_main
      - ci-checks
    if: >-
      always() &&
      !cancelled() &&
      needs.dependency_review.result == 'success' &&
      (needs.osv_scan_pr.result == 'success' || needs.osv_scan_pr.result == 'skipped') &&
      (needs.osv_scan_main.result == 'success' || needs.osv_scan_main.result == 'skipped') &&
      needs.ci-checks.result == 'success'
    steps:
      - name: All security gates passed
        run: echo "lint, test, build, dependency review, and OSV scan succeeded."

  coverage_report:
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - ci-checks
      - base_coverage
    permissions:
      checks: write
      pull-requests: write
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/ci

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report

      - name: Download base coverage report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: base-coverage-report

      - name: Resolve base coverage file
        id: base_cov
        run: |
          if [ -f base-coverage-report/report.json ]; then
            echo "path=./base-coverage-report/report.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=./report.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect test coverage
        if: hashFiles('report.json') != ''
        uses: ArtiomTr/jest-coverage-report-action@v2
        id: coverage
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: ./report.json
          base-coverage-file: ${{ steps.base_cov.outputs.path }}
          skip-step: all
          annotations: warning
          output: report-markdown
          pull-request-number: ${{ github.event.pull_request.number }}

      - name: Save coverage markdown
        if: steps.coverage.outputs.report != ''
        env:
          REPORT: ${{ steps.coverage.outputs.report }}
        run: printf '%s\n' "$REPORT" > coverage-markdown.md

      - name: Resolve coverage inputs
        id: coverage_inputs
        run: |
          if [ -f base-coverage-report/report.json ]; then
            echo "base_report_path=base-coverage-report/report.json" >> "$GITHUB_OUTPUT"
          else
            echo "base_report_path=" >> "$GITHUB_OUTPUT"
          fi
          if [ -f coverage-markdown.md ]; then
            echo "coverage_markdown_path=coverage-markdown.md" >> "$GITHUB_OUTPUT"
          else
            echo "coverage_markdown_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR quality report
        if: hashFiles('report.json') != ''
        env:
          JEST_REPORT_PATH: report.json
          BASE_REPORT_PATH: ${{ steps.coverage_inputs.outputs.base_report_path }}
          COVERAGE_MARKDOWN_PATH: ${{ steps.coverage_inputs.outputs.coverage_markdown_path }}
        run: node scripts/ci/build-pr-status-comment.mjs

      - name: Post PR quality report
        if: hashFiles('pr-quality-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-quality-report
          path: pr-quality-comment.md

      - name: Upload PR quality report artifact
        if: hashFiles('pr-quality-comment.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-report
          path: pr-quality-comment.md
          retention-days: 7

  ci_summary:
    runs-on: ubuntu-latest
    needs:
      - security_gates
      - coverage_report
    if: always()
    steps:
      - name: Write CI timing summary
        run: |
          echo "## CI timing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ci-checks | ${{ needs.security_gates.result == 'success' && '✅' || 'see jobs' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| security_gates | ${{ needs.security_gates.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| coverage_report | ${{ needs.coverage_report.result }} |" >> "$GITHUB_STEP_SUMMARY"
