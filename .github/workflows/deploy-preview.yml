name: Deploy to Cloudflare (PR Preview)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-preview.yml'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-preview.yml'
      - '.github/actions/**'
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  deploy_preview:
    if: |
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: Resolve workflow context
        id: ctx
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const isWorkflowRun = context.eventName === 'workflow_run';
            const isPR = isWorkflowRun
              ? run.event === 'pull_request'
              : context.eventName === 'pull_request';
            let prNumber = '';
            let headRef = '';
            let headSha = '';

            if (isWorkflowRun) {
              headRef = run.head_branch || 'main';
              headSha = run.head_sha;
              if (isPR && run.pull_requests?.length > 0) {
                prNumber = String(run.pull_requests[0].number);
              } else if (isPR) {
                const { data: prs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: `${context.repo.owner}:${run.head_branch}`,
                });
                if (prs.length > 0) {
                  prNumber = String(prs[0].number);
                }
              }
            } else if (context.eventName === 'pull_request') {
              prNumber = String(context.payload.pull_request.number);
              headRef = context.payload.pull_request.head.ref;
              headSha = context.payload.pull_request.head.sha;
            } else {
              headRef = 'main';
              headSha = context.sha;
            }

            core.setOutput('is_pr', isPR ? 'true' : 'false');
            core.setOutput('pr_number', prNumber);
            core.setOutput('head_ref', headRef);
            core.setOutput('head_sha', headSha);

      - name: Wait for CI workflow
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.ctx.outputs.head_sha }}"
          for attempt in $(seq 1 90); do
            CONCLUSION=$(gh run list --workflow=ci.yml --commit "$SHA" --json conclusion --jq '.[0].conclusion // empty')
            STATUS=$(gh run list --workflow=ci.yml --commit "$SHA" --json status --jq '.[0].status // empty')

            if [ "$CONCLUSION" = "success" ]; then
              echo "CI succeeded for ${SHA}"
              exit 0
            fi

            if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ]; then
              echo "CI finished with conclusion: ${CONCLUSION}"
              exit 1
            fi

            echo "Waiting for CI (attempt ${attempt}/90, status=${STATUS:-unknown})..."
            sleep 20
          done

          echo "Timed out waiting for CI workflow"
          exit 1

      - name: Compute preview name and route
        id: preview
        run: |
          RAW_BRANCH="${{ steps.ctx.outputs.head_ref }}"
          BRANCH_SLUG=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-40)
          if [ -z "$BRANCH_SLUG" ]; then
            BRANCH_SLUG="${{ steps.ctx.outputs.pr_number && format('pr-{0}', steps.ctx.outputs.pr_number) || 'main' }}"
          fi
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js project
        uses: ./.github/actions/setup-node-project
        with:
          lfs: 'true'
          ref: ${{ steps.ctx.outputs.head_sha }}

      - name: Inject D1 database IDs into Wrangler config
        env:
          CF_D1_SEARCH_DB_ID: ${{ secrets.CF_D1_SEARCH_DB_ID }}
        run: node scripts/ci/inject-d1-database-ids.mjs

      - name: Build search index
        if: ${{ steps.ctx.outputs.is_pr != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.preview.outputs.branch_slug }}
        run: npm run build:search

      - name: Deploy to Cloudflare (preview for PR)
        id: deploy
        if: ${{ steps.ctx.outputs.is_pr == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GIT_TAG: main
          NEXT_PUBLIC_SITE_URL: ${{ format('{0}-{1}.{2}.workers.dev', steps.preview.outputs.branch_slug, vars.CLOUDFLARE_WORKER_NAME, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
        run: |
          LOG=$(npm run upload -- --preview-alias ${{ steps.preview.outputs.branch_slug }} --tag $NEXT_PUBLIC_GIT_TAG 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          PREVIEW_URL=$(echo "$LOG" | grep -oE 'Version Preview URL: https?://[^[:space:]]+' | awk '{print $4}')
          BRANCH_PREVIEW_URL=$(echo "$LOG" | grep -oE 'Version Preview Alias URL: https?://[^[:space:]]+' | awk '{print $5}')
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "branch_preview_url=$BRANCH_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare (main)
        id: deploy_preview_main
        if: ${{ steps.ctx.outputs.is_pr != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_PREVIEW_SITE_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.preview.outputs.branch_slug }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
        run: |
          LOG=$(npm run upload -- --tag main 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          npx wrangler versions deploy -y "$VERSION_ID"

      - name: Download CI PR quality report
        if: ${{ steps.ctx.outputs.is_pr == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            gh run download "${{ github.event.workflow_run.id }}" -n pr-quality-report || true
          else
            SHA="${{ steps.ctx.outputs.head_sha }}"
            RUN_ID=$(gh run list --workflow=ci.yml --commit "$SHA" --json databaseId --jq '.[0].databaseId')
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              gh run download "$RUN_ID" -n pr-quality-report || true
            fi
          fi

      - name: Update PR quality report with deployment
        if: ${{ steps.ctx.outputs.is_pr == 'true' }}
        env:
          DEPLOY_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          BRANCH_PREVIEW_URL: ${{ steps.deploy.outputs.branch_preview_url }}
          WORKER_VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          COMMENT_SOURCE=""
          for candidate in pr-quality-comment.md pr-quality-report/pr-quality-comment.md; do
            if [ -f "$candidate" ]; then
              COMMENT_SOURCE="$candidate"
              break
            fi
          done

          if [ -n "$COMMENT_SOURCE" ]; then
            INPUT_PATH="$COMMENT_SOURCE" OUTPUT_PATH=pr-quality-comment.md node scripts/ci/patch-pr-status-deploy.mjs
          else
            cat > pr-quality-comment.md <<'EOF'
<!-- pr-quality-report -->
## PR Quality Report

| Category | Status |
| --- | --- |
| Tests | — |
| Coverage | — |
| Preview Deployment | ⏳ Deploying… |
| Worker Version | _pending deploy_ |
EOF
            INPUT_PATH=pr-quality-comment.md OUTPUT_PATH=pr-quality-comment.md node scripts/ci/patch-pr-status-deploy.mjs
          fi

      - name: Post unified PR quality report
        if: ${{ steps.ctx.outputs.is_pr == 'true' && hashFiles('pr-quality-comment.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-quality-report
          path: pr-quality-comment.md

      - name: Update deployment status
        if: ${{ always() }}
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.ctx.outputs.head_sha }}';
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const previewUrl = `${{ steps.deploy.outputs.preview_url }}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state,
              context: 'deploy/preview',
              description: state === 'success' ? 'Preview deployed' : 'Preview deploy failed',
              target_url: previewUrl || undefined,
            });
