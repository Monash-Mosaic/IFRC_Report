name: Deploy to Cloudflare (PR Preview)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  deploy_preview:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: Resolve workflow context
        id: ctx
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const isPR = run.event === 'pull_request';
            let prNumber = '';

            if (isPR && run.pull_requests?.length > 0) {
              prNumber = String(run.pull_requests[0].number);
            } else if (isPR) {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${run.head_branch}`,
              });
              if (prs.length > 0) {
                prNumber = String(prs[0].number);
              }
            }

            core.setOutput('is_pr', isPR ? 'true' : 'false');
            core.setOutput('pr_number', prNumber);
            core.setOutput('head_ref', run.head_branch || 'main');
            core.setOutput('head_sha', run.head_sha);

      - name: Compute preview name and route
        id: preview
        run: |
          RAW_BRANCH="${{ steps.ctx.outputs.head_ref }}"
          BRANCH_SLUG=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-40)
          if [ -z "$BRANCH_SLUG" ]; then
            BRANCH_SLUG="${{ steps.ctx.outputs.pr_number && format('pr-{0}', steps.ctx.outputs.pr_number) || 'main' }}"
          fi
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js project
        uses: ./.github/actions/setup-node-project
        with:
          lfs: 'true'
          ref: ${{ steps.ctx.outputs.head_sha }}

      - name: Inject D1 database IDs into Wrangler config
        env:
          CF_D1_SEARCH_DB_ID: ${{ secrets.CF_D1_SEARCH_DB_ID }}
        run: node scripts/ci/inject-d1-database-ids.mjs

      - name: Build search index
        if: ${{ steps.ctx.outputs.is_pr != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.preview.outputs.branch_slug }}
        run: npm run build:search

      - name: Deploy to Cloudflare (preview for PR)
        id: deploy
        if: ${{ steps.ctx.outputs.is_pr == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GIT_TAG: main
          NEXT_PUBLIC_SITE_URL: ${{ format('{0}-{1}.{2}.workers.dev', steps.preview.outputs.branch_slug, vars.CLOUDFLARE_WORKER_NAME, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
        run: |
          LOG=$(npm run upload -- --preview-alias ${{ steps.preview.outputs.branch_slug }} --tag $NEXT_PUBLIC_GIT_TAG 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          PREVIEW_URL=$(echo "$LOG" | grep -oE 'Version Preview URL: https?://[^[:space:]]+' | awk '{print $4}')
          BRANCH_PREVIEW_URL=$(echo "$LOG" | grep -oE 'Version Preview Alias URL: https?://[^[:space:]]+' | awk '{print $5}')
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "branch_preview_url=$BRANCH_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare (main)
        id: deploy_preview_main
        if: ${{ steps.ctx.outputs.is_pr != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_PREVIEW_SITE_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.preview.outputs.branch_slug }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
        run: |
          LOG=$(npm run upload -- --tag main 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          npx --yes wrangler@4 versions deploy -y "$VERSION_ID"

      - name: Comment preview URL on PR
        if: ${{ steps.ctx.outputs.is_pr == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = Number('${{ steps.ctx.outputs.pr_number }}');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const versionId = `${{ steps.deploy.outputs.version_id }}`;
            const previewUrl = `${{ steps.deploy.outputs.preview_url }}`;
            const branchPreviewUrl = `${{ steps.deploy.outputs.branch_preview_url }}`;
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n| Key | Value |\n|---|---|\n| Cloudflare Worker Version ID | ${versionId} |\n| Preview URL | ${previewUrl} |\n| Branch Preview URL | ${branchPreviewUrl} |`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });

      - name: Update deployment status
        if: ${{ always() }}
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = '${{ steps.ctx.outputs.head_sha }}';
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const previewUrl = `${{ steps.deploy.outputs.preview_url }}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state,
              context: 'deploy/preview',
              description: state === 'success' ? 'Preview deployed' : 'Preview deploy failed',
              target_url: previewUrl || undefined,
            });
