name: Deploy to Cloudflare (PR Preview)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - 'jest.setup.js'
      - 'next.config.*'
      - 'open-next.config.*'
      - 'wrangler.jsonc'
      - 'eslint.config.*'
      - '.github/**'

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: Compute preview name and route
        id: preview
        run: |
          RAW_BRANCH="${{ github.head_ref || github.ref_name }}"
          BRANCH_SLUG=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-40)
          if [ -z "$BRANCH_SLUG" ]; then
            BRANCH_SLUG="${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}"
          fi
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ steps.preview.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm install --package-lock-only --workspaces --include-workspace-root
          fi
          npm ci

      - name: Inject D1 database IDs into Wrangler config
        env:
          CF_D1_SEARCH_DB_ID: ${{ secrets.CF_D1_SEARCH_DB_ID }}
        run: node scripts/ci/inject-d1-database-ids.mjs

      - name: Build search index
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.preview.outputs.branch_slug }}
        run: npm run build:search

      - name: Deploy to Cloudflare (preview for PR)
        id: deploy_pr
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_GIT_TAG: main
          NEXT_PUBLIC_SITE_URL: ${{ format('{0}-{1}.{2}.workers.dev', steps.preview.outputs.branch_slug, vars.CLOUDFLARE_WORKER_NAME, vars.CLOUDFLARE_WORKERS_SUBDOMAIN) }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
        run: |
          LOG=$(npm run upload -- --preview-alias ${{ steps.preview.outputs.branch_slug }} --tag $NEXT_PUBLIC_GIT_TAG 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          BRANCH_PREVIEW_URL=$(echo "$LOG" | grep -oE 'Version Preview Alias URL: https?://[^[:space:]]+' | awk '{print $5}')
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "branch_preview_url=$BRANCH_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare (main)
        id: deploy_main
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_PREVIEW_SITE_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.preview.outputs.branch_slug }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
        run: |
          LOG=$(npm run upload -- --tag main 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          npx wrangler versions deploy -y "$VERSION_ID"

      - name: Post preview URL immediately
        if: github.event_name == 'pull_request' && steps.deploy_pr.outcome == 'success'
        env:
          BRANCH_PREVIEW_URL: ${{ steps.deploy_pr.outputs.branch_preview_url }}
          WORKER_VERSION_ID: ${{ steps.deploy_pr.outputs.version_id }}
        run: |
          if [ -n "$BRANCH_PREVIEW_URL" ]; then
            DEPLOY_LINE="✅ [${BRANCH_PREVIEW_URL}](${BRANCH_PREVIEW_URL})"
          else
            DEPLOY_LINE="⏳ Deploying…"
          fi
          if [ -n "$WORKER_VERSION_ID" ]; then
            WORKER_LINE="\`${WORKER_VERSION_ID}\`"
          else
            WORKER_LINE="_pending deploy_"
          fi

          {
            echo '<!-- pr-quality-report -->'
            echo '## PR Quality Report'
            echo ''
            echo '| Category | Status |'
            echo '| --- | --- |'
            echo '| Tests | ⏳ Running… |'
            echo '| Coverage | ⏳ Running… |'
            echo "| Preview Deployment | ${DEPLOY_LINE} |"
            echo "| Worker Version | ${WORKER_LINE} |"
          } > pr-quality-comment.md

      - name: Publish early preview comment
        if: github.event_name == 'pull_request' && steps.deploy_pr.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-quality-report
          path: pr-quality-comment.md

      - name: Wait for CI quality report artifact
        if: github.event_name == 'pull_request'
        id: wait_ci_report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf pr-quality-report
          # CI runs on the PR merge commit (github.sha), not the head branch SHA.
          CI_COMMIT="${{ github.sha }}"

          has_quality_artifact() {
            local run_id="$1"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[] | select(.name == "pr-quality-report") | .name' \
              | grep -q '^pr-quality-report$'
          }

          for attempt in $(seq 1 90); do
            CI_RUN_ID=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "CI" \
              --commit "$CI_COMMIT" \
              --json databaseId,status,conclusion \
              --jq 'map(select(.status != "cancelled")) | .[0].databaseId // empty')

            if [ -z "$CI_RUN_ID" ]; then
              CI_RUN_ID=$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow ci.yml \
                --commit "$CI_COMMIT" \
                --json databaseId,status,conclusion \
                --jq 'map(select(.status != "cancelled")) | .[0].databaseId // empty')
            fi

            if [ -n "$CI_RUN_ID" ] && has_quality_artifact "$CI_RUN_ID"; then
              if gh run download "$CI_RUN_ID" -n pr-quality-report -R "${GITHUB_REPOSITORY}"; then
                echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            if [ -n "$CI_RUN_ID" ]; then
              CI_STATUS=$(gh run view "$CI_RUN_ID" --repo "${GITHUB_REPOSITORY}" --json status,conclusion --jq '.status + " " + (.conclusion // "")')
              echo "CI run ${CI_RUN_ID} status: ${CI_STATUS} (attempt ${attempt}/90)"
              if echo "$CI_STATUS" | grep -q '^completed'; then
                echo "CI finished without pr-quality-report artifact; keeping early preview comment."
                echo "ready=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Waiting for CI workflow run on commit ${CI_COMMIT} (attempt ${attempt}/90)..."
            fi

            sleep 20
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Merge CI report with deployment status
        id: merge_comment
        if: github.event_name == 'pull_request'
        env:
          DEPLOY_STATUS: ${{ steps.deploy_pr.outcome == 'success' && 'success' || 'failed' }}
          BRANCH_PREVIEW_URL: ${{ steps.deploy_pr.outputs.branch_preview_url }}
          WORKER_VERSION_ID: ${{ steps.deploy_pr.outputs.version_id }}
          REPORT_READY: ${{ steps.wait_ci_report.outputs.ready }}
        run: |
          COMMENT_FILE=""
          for candidate in pr-quality-report/pr-quality-comment.md pr-quality-comment.md; do
            if [ -f "$candidate" ]; then
              COMMENT_FILE="$candidate"
              break
            fi
          done

          if [ -n "$COMMENT_FILE" ] && [ "$COMMENT_FILE" != pr-quality-comment.md ]; then
            cp "$COMMENT_FILE" pr-quality-comment.md
          elif [ ! -f pr-quality-comment.md ]; then
            {
              echo '<!-- pr-quality-report -->'
              echo '## PR Quality Report'
              echo ''
              echo '| Category | Status |'
              echo '| --- | --- |'
              echo '| Tests | — |'
              echo '| Coverage | — |'
              echo '| Preview Deployment | ⏳ Deploying… |'
              echo '| Worker Version | _pending deploy_ |'
            } > pr-quality-comment.md
          fi

          if [ "$DEPLOY_STATUS" = "success" ] && [ -n "$BRANCH_PREVIEW_URL" ]; then
            DEPLOY_LINE="✅ [${BRANCH_PREVIEW_URL}](${BRANCH_PREVIEW_URL})"
          elif [ "$DEPLOY_STATUS" = "failed" ]; then
            DEPLOY_LINE="❌ Deploy failed"
          else
            DEPLOY_LINE="⏳ Deploying…"
          fi

          if [ -n "$WORKER_VERSION_ID" ]; then
            WORKER_LINE="\`${WORKER_VERSION_ID}\`"
          else
            WORKER_LINE="—"
          fi

          export DEPLOY_LINE WORKER_LINE
          perl -i -pe 's#\| Preview Deployment \| [^|]+ \|#| Preview Deployment | $ENV{DEPLOY_LINE} |#' pr-quality-comment.md
          perl -i -pe 's#\| Worker Version \| [^|]+ \|#| Worker Version | $ENV{WORKER_LINE} |#' pr-quality-comment.md
          grep -v '^\*\*Branch preview:\*\*' pr-quality-comment.md > pr-quality-comment.md.tmp \
            && mv pr-quality-comment.md.tmp pr-quality-comment.md

          if [ ! -s pr-quality-comment.md ]; then
            echo "::error::PR quality comment file is missing or empty after merge."
            exit 1
          fi

          if [ "$REPORT_READY" != "true" ]; then
            echo "CI quality report artifact not ready; keeping early preview comment."
          fi

      - name: Post unified PR quality report
        if: >-
          github.event_name == 'pull_request' &&
          steps.merge_comment.outcome == 'success' &&
          steps.wait_ci_report.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-quality-report
          path: pr-quality-comment.md

      - name: Update deployment status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const previewUrl = '${{ steps.deploy_pr.outputs.branch_preview_url }}';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state,
              context: 'deploy/preview',
              description: state === 'success' ? 'Preview deployed' : 'Preview deploy failed',
              target_url: previewUrl || undefined,
            });

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf node_modules .next .open-next pr-quality-report
          rm -f pr-quality-comment.md
